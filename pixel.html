<!-- =====================================================================
     The poster. One screen, one drawing, one door.

     The prism scene is rendered at low resolution and scaled up with the
     smoothing off. What the seven rays mean depends on the lens the
     visitor picks: research directions, languages, or SAE features. Same
     beam every time; only the reading changes, which is roughly the
     thesis. The actual content lives in home.html.
     ===================================================================== -->
<body>
  <div class="mesh" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <nav class="nav">
    <a class="nav-brand" href="index.html">Yilong Wang</a>
    <div class="nav-list">
      <a href="home.html#about">About</a>
      <a href="home.html#research">Research</a>
      <a href="home.html#publications">Publications</a>
      <a href="home.html#contact">Contact</a>
    </div>
  </nav>

  <header class="hero" id="top">
    <canvas class="spectrum" id="spectrum" aria-hidden="true"></canvas>

    <div class="hero-inner">
      <!-- On narrow screens the canvas has no room for ray labels, so the
           same seven names appear here instead, filled in by landing.js
           and swapped with the lens. Hidden on desktop. -->
      <div class="ray-legend rise" id="rayLegend"></div>

      <p class="eyebrow rise">Student researcher · TU Berlin</p>
      <h1 class="hero-name rise">Yilong Wang</h1>

      <p class="lens-caption rise" id="lensCaption">These rays are the seven areas my research covers.</p>

      <div class="lens rise" role="group" aria-label="Choose what the prism splits the beam into">
        <span class="lens-label">Lens</span>
        <span class="lens-group">
          <button type="button" class="lens-btn on" data-mode="research" aria-pressed="true">Research</button>
          <button type="button" class="lens-btn" data-mode="languages" aria-pressed="false">Languages</button>
          <button type="button" class="lens-btn" data-mode="features" aria-pressed="false">Features</button>
        </span>
      </div>

      <a class="enter rise" href="home.html">Enter <span aria-hidden="true">▸</span></a>
    </div>
  </header>

  <script src="assets/js/landing.js"></script>
</body>
</html>
